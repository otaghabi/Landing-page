<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Premium GitHub Slider</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="page">
        <section class="premium-slider" id="slider" aria-label="اسلایدشو حرفه‌ای تصاویر">
            <div class="ambient-layer" id="ambientLayer"></div>
            <div class="noise-layer"></div>

            <div class="slider-shell">
                <div class="top-progress">
                    <div class="top-progress__fill" id="progressFill"></div>
                </div>

                <div class="slides" id="slides">
                    <div class="slider-message">
                        <div class="loader"></div>
                        <p>در حال دریافت تصاویر از GitHub...</p>
                    </div>
                </div>

                <div class="shade shade-left"></div>
                <div class="shade shade-bottom"></div>

                <header class="slider-header">
                    <div class="brand">
                        <span class="brand__dot"></span>
                        <div>
                            <strong>Premium Gallery</strong>
                            <small>Powered by GitHub</small>
                        </div>
                    </div>

                    <div class="header-actions">
                        <div class="counter" id="slideCounter">00 / 00</div>

                        <button
                            class="icon-button"
                            id="pauseButton"
                            type="button"
                            aria-label="توقف اسلایدشو"
                            title="توقف یا ادامه اسلایدشو"
                        >
                            <span id="pauseIcon">Ⅱ</span>
                        </button>

                        <button
                            class="icon-button"
                            id="fullscreenButton"
                            type="button"
                            aria-label="نمایش تمام‌صفحه"
                            title="نمایش تمام‌صفحه"
                        >
                            <span>⛶</span>
                        </button>
                    </div>
                </header>

                <div class="slider-content">
                    <div class="content-card" id="contentCard">
                        <span class="eyebrow">تصویر منتخب</span>
                        <h1 id="captionTitle">در حال بارگذاری</h1>
                        <p id="captionDescription">
                            تصاویر این گالری مستقیماً از مخزن GitHub شما دریافت می‌شوند.
                        </p>

                        <div class="content-meta">
                            <span id="fileType">IMAGE</span>
                            <span class="meta-separator"></span>
                            <span id="fileName">—</span>
                        </div>
                    </div>
                </div>

                <div class="slider-controls">
                    <button
                        class="nav-button nav-button--previous"
                        id="previousButton"
                        type="button"
                        aria-label="تصویر قبلی"
                    >
                        <span class="nav-button__icon">›</span>
                        <span class="nav-button__text">قبلی</span>
                    </button>

                    <div class="thumbnail-wrap">
                        <div class="thumbnail-track" id="thumbnailTrack"></div>
                    </div>

                    <button
                        class="nav-button nav-button--next"
                        id="nextButton"
                        type="button"
                        aria-label="تصویر بعدی"
                    >
                        <span class="nav-button__text">بعدی</span>
                        <span class="nav-button__icon">‹</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
